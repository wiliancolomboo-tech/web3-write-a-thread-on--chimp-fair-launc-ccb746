[package]
name = "chimp_fair_launch"
version = "0.1.0"
description = "High-integrity, MEV-resistant pro-rata fair launch protocol for $CHIMP on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chimp_fair_launch"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }