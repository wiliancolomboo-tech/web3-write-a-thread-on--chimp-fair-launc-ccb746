version: "3.8"

services:
  chimp-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimp-fair-launch-daemon
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - KEYPAIR_PATH=/secrets/keeper-keypair.json
      - PROGRAM_ID=CH1MP11111111111111111111111111111111111111
      - TOKEN_MINT=CHIMP7vXhU6q22f7cK45v8t5G2e9m8F3m9L2q8P1pump
      - ALERT_WEBHOOK_URL=https://discord.com/api/webhooks/YOUR_WEBHOOK_TOKEN
    volumes:
      - ./secrets:/secrets:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"