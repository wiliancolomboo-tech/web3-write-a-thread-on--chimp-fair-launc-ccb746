version: "3.8"

services:
  chimp-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimp_fair_launch_keeper
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - CHIMP_PROGRAM_ID=CHMP1auncH111111111111111111111111111111111
      - TOKEN_MINT=CHMPxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - KEEPER_KEYPAIR_PATH=/secrets/keeper-keypair.json
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/your/webhook/here
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/your/webhook/here
    volumes:
      - ./secrets:/secrets:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"