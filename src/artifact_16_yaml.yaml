version: "3.8"

services:
  chimp-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimp_fair_launch_daemon
    restart: always
    environment:
      - RPC_URL=https://api.mainnet-beta.solana.com
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - POOL_PUBKEY=CHMPf41rLaunchEngine1111111111111111111111
      - KEYPAIR_PATH=/etc/solana/id.json
      - PORT=8080
    volumes:
      - ./secrets/id.json:/etc/solana/id.json:ro
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"