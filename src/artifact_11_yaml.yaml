version: "3.8"

services:
  chimp-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimp-fairlaunch-keeper
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=CH1MPfaiR1111111111111111111111111111111111
      - CHIMP_TOKEN_MINT=7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
      - KEEPER_KEYPAIR_PATH=/secrets/keeper-keypair.json
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - ./secrets:/secrets:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3