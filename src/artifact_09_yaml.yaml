version: "3.9"

services:
  chimp-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=ChimpFL1111111111111111111111111111111111111
      - CHIMP_TOKEN_MINT=7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
      - KEEPER_KEYPAIR_JSON=${KEEPER_KEYPAIR_JSON}
      - ENTERPRISE_WEBHOOK_URL=${ENTERPRISE_WEBHOOK_URL}
      - PORT=8080
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"