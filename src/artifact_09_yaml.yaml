version: "3.8"

services:
  chimp-crank-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimp-crank-monitor
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/dummy/chimp-alerts
      - RESEND_API_KEY=re_dummy123456789
      - RESEND_ALERT_EMAIL=ops@chimp.money
      - KEYPAIR_PATH=/secrets/id.json
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"