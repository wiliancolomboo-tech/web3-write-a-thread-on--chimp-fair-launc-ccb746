version: "3.8"

services:
  chimp-telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=ChimpLaunch1111111111111111111111111111111111
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/xxxx/yyyy
      - RESEND_API_KEY=re_123456789abcdef
      - ALERT_EMAIL=security@chimp.capital
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"