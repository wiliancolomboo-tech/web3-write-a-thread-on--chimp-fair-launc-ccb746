version: '3.8'

services:
  chimp-crank-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimp-crank-engine
    restart: always
    environment:
      - ANCHOR_PROVIDER_URL=${ANCHOR_PROVIDER_URL}
      - ANCHOR_WALLET=/app/keys/id.json
      - CHIMP_PROGRAM_ID=${CHIMP_PROGRAM_ID}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - OPERATIONAL_EMAIL=${OPERATIONAL_EMAIL}
      - PORT=8080
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"