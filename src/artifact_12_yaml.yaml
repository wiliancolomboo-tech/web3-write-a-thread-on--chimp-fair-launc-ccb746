version: '3.8'

services:
  chimp-settlement-crank:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - RPC_URL=https://api.mainnet-beta.solana.com
      - KEYPAIR_PATH=/run/secrets/crank_keypair.json
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/your-enterprise-hook
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/your-enterprise-hook
      - POOL_PUBKEY=ChimpFL111111111111111111111111111111111111
      - PORT=8080
    ports:
      - "8080:8080"
    secrets:
      - crank_keypair.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  crank_keypair.json:
    file: ./crank-keypair.json