version: '3.8'

services:
  chimp-telemetry-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimp-telemetry-daemon
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - CHIMP_PROGRAM_ID=CH1MPy8vJbL37e8cHQ2mUvxvXwKzgH9F6Wn7yP4d83Z9
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    healthcheck:
      test: ["CMD-SHELL", "node -e 'console.log(\"Alive\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"