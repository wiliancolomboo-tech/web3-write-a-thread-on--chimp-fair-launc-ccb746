version: "3.8"

services:
  chimp-sentinel:
    build: .
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=CH1MPy8vD3mN1A3vQGZ8r6gK2T3Lq6mZ7dE1h5J9XYZ
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/dummy/chimp-alerts
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/dummy/chimp-alerts
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"